<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Laser input UI</title>
    <meta name="description" content="Laser input UI • A-Frame">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/info-message.js"></script>
    <script src="highlight.js"></script>
    <script src="info-panel.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/remix-dropdown.js"></script>
  </head>
  <body>
    <!-- MODIFICADO: fondo azul noche en vez de morado, y el entorno ahora
         usa el preset "starry" (cielo estrellado) en vez del default -->
    <a-scene
      background="color: #0B1026"
      environment="preset: starry; ground: canyon; groundColor: #2B2B3A; dressingAmount: 10"
      cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .raycastable"
      info-message="htmlSrc: #messageText">
      <a-assets>
        <a-asset-item id="messageText" src="message.html"></a-asset-item>
        <!--
          Image source: http://www.ghibli.jp/works/kazetachinu/#frame&gid=1&pid=1
          Image author: Studio Ghibli
        -->
        <img id="kazetachinu" src="https://cdn.aframe.io/examples/ui/kazetachinu.jpg" crossorigin="anonymous"/>
        <img id="kazetachinuPoster" src="https://cdn.aframe.io/examples/ui/kazetachinuPoster.jpg" crossorigin="anonymous"/>
        <!--
          Image source: http://www.ghibli.jp/works/ponyo/#frame&gid=1&pid=36
          Image author: Studio Ghibli
        -->
        <img id="ponyo" src="https://cdn.aframe.io/examples/ui/ponyo.jpg" crossorigin="anonymous"/>
        <img id="ponyoPoster" src="https://cdn.aframe.io/examples/ui/ponyoPoster.jpg" crossorigin="anonymous"/>
        <!--
          Image source: http://www.ghibli.jp/works/karigurashi/#frame&gid=1&pid=32
          Image author: Studio Ghibli
        -->
        <img id="karigurashi" src="https://cdn.aframe.io/examples/ui/karigurashi.jpg" crossorigin="anonymous"/>
        <img id="karigurashiPoster" src="https://cdn.aframe.io/examples/ui/karigurashiPoster.jpg" crossorigin="anonymous"/>
        <!-- MODIFICADO: el marco ahora es dorado en vez de blanco, y al pasarle
             el laser encima crece más (1.35 en vez de 1.2) y más rápido -->
        <a-mixin
          id="frame"
          geometry="primitive: plane; width: 0.5783552; height: 0.8192"
          material="color: #FFD166; shader: flat"
          animation__scale="property: scale; to: 1.35 1.35 1.35; dur: 150; startEvents: mouseenter"
          animation__scale_reverse="property: scale; to: 1 1 1; dur: 150; startEvents: mouseleave"
         ></a-mixin>
         <a-mixin
          id="poster"
          geometry="primitive: plane; width: 0.544768; height: 0.786432"
          material="color: white; shader: flat"
          material="shader: flat"
          position="0 0 0.005"
         ></a-mixin>
         <a-mixin
          id="movieImage"
          geometry="primitive: plane; width: 1.5; height: 0.81"
          material="src: #ponyo; shader: flat; transparent: true"
          position="0 0.495 0.002"
         ></a-mixin>
      </a-assets>
      <a-entity
        id="background"
        position="0 0 0"
        geometry="primitive: sphere; radius: 2.0"
        material="color: red; side: back; shader: flat"
        scale="0.001 0.001 0.001"
        visible="false" class="raycastable">
      </a-entity>
      <a-entity
        position="0 1.6 0"
        camera look-controls="magicWindowTrackingEnabled: false; touchEnabled: false; mouseEnabled: false">
        <a-entity
          id="fadeBackground"
          geometry="primitive: sphere; radius: 2.5"
          material="color: #999999; side: back; shader: flat; blending: subtractive;" visible="false">
        </a-entity>
      </a-entity>
      <!-- Hand controls -->
      <!-- MODIFICADO: cada mano tiene su propio color de laser (rojo y amarillo)
           para distinguir cuál estás usando -->
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .raycastable" line="color: #FF6B6B"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .raycastable" line="color: #FFD166"></a-entity>
      <!-- MODIFICADO: acerqué el menu de -2.5 a -2.2 y lo subí un poco -->
      <a-entity id="ui" position="0 1.7 -2.2">
        <!-- MODIFICADO: titulo flotante nuevo arriba del menu -->
        <a-text value="Elige una pelicula"
                position="-0.75 0.75 0" color="#FFD166" width="3"></a-text>
        <!-- Poster menu -->
        <!-- MODIFICADO: los posters estan mas separados (1.1 en vez de 0.8) y
             los de los lados estan girados hacia adentro, en semicirculo -->
        <a-entity id="menu" highlight>
          <a-entity id="karigurashiButton" position="-1.1 0 0.15" rotation="0 18 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #karigurashiPoster;" mixin="poster"></a-entity>
          </a-entity>
          <a-entity id="kazetachinuButton" position="0 0 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #kazetachinuPoster" mixin="poster"></a-entity>
          </a-entity>
          <a-entity id="ponyoButton" position="1.1 0 0.15" rotation="0 -18 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #ponyoPoster" mixin="poster"></a-entity>
          </a-entity>
        </a-entity>
        <!-- Info panel of the selected movie. -->
        <!-- MODIFICADO: el panel es azul oscuro en vez de gris, mas ancho,
             y aparece un poco mas cerca de la camara -->
        <a-entity
          id="infoPanel"
          position="0 0 0.6"
          info-panel
          visible="false"
          scale="0.001 0.001 0.001"
          geometry="primitive: plane; width: 1.7; height: 1.9"
          material="color: #1B2A41; shader: flat; transparent: false" class="raycastable">
          <a-entity id="ponyoMovieImage" mixin="movieImage" material="src: #ponyo" visible="false"></a-entity>
          <a-entity id="kazetachinuMovieImage" mixin="movieImage" material="src: #kazetachinu" visible="false"></a-entity>
          <a-entity id="karigurashiMovieImage" mixin="movieImage" material="src: #karigurashi" visible="false"></a-entity>
          <!-- MODIFICADO: el titulo de la pelicula ahora es dorado -->
          <a-entity id="movieTitle"
            position="-0.78 -0.1 0"
            text="shader: msdf; anchor: left; width: 1.6; font: https://cdn.aframe.io/examples/ui/Viga-Regular.json; color: #FFD166; value: Ponyo (2003)"></a-entity>
          <!-- MODIFICADO: la descripcion en azul claro en vez de blanco puro -->
          <a-entity id="movieDescription"
            position="-0.78 -0.2 0"
            text="baseline: top; shader: msdf; anchor: left; font: https://cdn.aframe.io/examples/ui/Viga-Regular.json; color: #D7E3F4; value: Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
